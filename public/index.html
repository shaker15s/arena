<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="منظومة تنظيم مراكز التدريب: حضور ذكي بـQR دوّار، جيميفيكيشن كامل، وشهادات رقمية قابلة للتحقق الفوري." />
    <meta name="theme-color" content="#007AFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta property="og:site_name" content="مسار — Masar" />
    <meta property="og:title" content="مسار — منظومة تنظيم مراكز التدريب" />
    <meta property="og:description" content="حضور ذكي بـQR دوّار، جيميفيكيشن كامل، وشهادات رقمية قابلة للتحقق الفوري." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="مسار — Masar" />
    <meta name="twitter:description" content="حضور ذكي بـQR دوّار، جيميفيكيشن كامل، وشهادات رقمية قابلة للتحقق الفوري." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      /*
        UX-08: منع وميض الثيم الخاطئ (FOUC). يُقرأ اختيار المستخدم من localStorage
        **قبل أول رسم** ويُلوّن الخلفية فورًا بالقيمة الصحيحة — نفس مفتاح
        `masar.theme.v1` ومنطق الحسم في src/design/theme.tsx.
        الألوان مرآة لـ tokens.ts: light bg = #F5F5FA، dark/oled bg = #000000.
      */
      (function () {
        try {
          var pref = null;
          try { pref = window.localStorage.getItem('masar.theme.v1'); } catch (e) {}
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = pref === 'dark' || pref === 'oled' || ((pref === null || pref === 'system') && sysDark);
          var bg = dark ? '#000000' : '#F5F5FA';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var st = document.createElement('style');
          st.id = 'masar-theme-boot';
          st.textContent = 'html, body { background: ' + bg + '; } #boot-splash { background: ' + bg + ' !important; }';
          document.head.appendChild(st);
        } catch (e) { /* تجاهل — يبقى السلوك الافتراضي */ }
      })();
    </script>
    <!-- react-native-web style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        flex: 1;
        overflow-x: hidden;
      }
    </style>
    <style id="masar-a11y-focus">
      /*
        A11Y-10 · A11Y-15 — طبقة التركيز المرئي (WCAG 2.4.7 / 2.4.13 / 1.4.11).
        القيمتان هنا مرآة لقيم `focusRing` في src/design/tokens.ts، وبوابة
        scripts/check-a11y.js تفشل إذا تباعدتا — مصدر واحد للحقيقة.
      */
      :root { --masar-focus: #0066CC; }
      @media (prefers-color-scheme: dark) { :root { --masar-focus: #6FB3FF; } }

      /* حلقة واضحة عند التنقل بالكيبورد فقط (لا تظهر مع اللمس/الماوس) */
      :focus-visible {
        outline: 3px solid var(--masar-focus);
        outline-offset: 2px;
      }
      /* عناصر الإدخال في react-native-web قد تحمل outline:none — نُعيد الحلقة */
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      [contenteditable]:focus-visible,
      a:focus-visible,
      button:focus-visible,
      [role="button"]:focus-visible,
      [role="tab"]:focus-visible,
      [role="link"]:focus-visible {
        outline: 3px solid var(--masar-focus);
        outline-offset: 2px;
      }
      /* لا نُظهر الحلقة على عنصر main عند نقل التركيز إليه برمجيًا */
      [role="main"]:focus { outline: none; }

      /*
        A11Y-12 / A11Y-15: الشريط السفلي العائم يُقاس ديناميكيًا عبر onLayout (--masar-tabbar-h)
        مع قيمة افتراضية 140px، لمنع حجب العنصر المُركَّز عليه (WCAG 2.2 — 2.4.11).
      */
      :root { --masar-tabbar-h: 140px; }
      html, body, #root { scroll-padding-bottom: var(--masar-tabbar-h, 140px); scroll-padding-top: 24px; }
      [role="main"], [role="region"] { scroll-padding-bottom: var(--masar-tabbar-h, 140px); }

      /* احترام تقليل الحركة على مستوى المستند أيضًا */
      @media (prefers-reduced-motion: reduce) {
        html:focus-within { scroll-behavior: auto; }
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      /* تباين أعلى لمن يطلبه النظام */
      @media (prefers-contrast: more) {
        :root { --masar-focus: #004A99; }
        @media (prefers-color-scheme: dark) { :root { --masar-focus: #9CCBFF; } }
      }
      /* FUNC-10: تباين عالٍ يختاره المستخدم من الإعدادات (يشتد مع إعداد النظام).
         نرفع قوة الحدود والفواصل وحلقة التركيز بدل تغيير الألوان — التغيير
         اللوني كان سيُخلّ بنسب التباين المقيسة في check-contrast. */
      html.masar-contrast {
        --masar-focus: #004A99;
      }
      html.masar-contrast * {
        border-color: currentColor !important;
      }
      html.masar-contrast [role="button"],
      html.masar-contrast a {
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      @media (prefers-color-scheme: dark) {
        html.masar-contrast { --masar-focus: #9CCBFF; }
      }
      /* حجم النص المُختار داخل التطبيق (يُطبّقه design/preferences.tsx) —
         الجذر يتكبّر أيضًا حتى تتناسب المسافات المبنية على الوحدات النسبية. */
      html[data-masar-text-scale="1.15"] { font-size: 115%; }
      html[data-masar-text-scale="1.3"] { font-size: 130%; }
    </style>
    <style id="expo-boot-splash">
      /* شاشة إقلاع فورية قبل تحميل الحزمة — تستبدلها BootSplash داخل التطبيق */
      #boot-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        /* يطابق bg الفاتح في tokens.ts (#F5F5FA) — تسليم بلا شرخ لوني */
        background: #F5F5FA;
        font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
      }
      #boot-splash .logo {
        width: 96px; height: 96px; border-radius: 28px;
        background: linear-gradient(135deg, #007AFF, #5856D6);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 44px; font-weight: 700;
        animation: masar-glow 1.2s ease-in-out infinite alternate;
      }
      #boot-splash .title { margin-top: 16px; font-size: 24px; font-weight: 700; color: #0F172A; letter-spacing: 0; }
      #boot-splash .caption { margin-top: 6px; font-size: 13px; color: #64748B; }
      #boot-splash .spinner {
        margin-top: 28px; width: 30px; height: 30px; border-radius: 50%;
        border: 3px solid #E0E7FF; border-top-color: #007AFF;
        animation: masar-spin 0.8s linear infinite;
      }
      @keyframes masar-spin { to { transform: rotate(360deg); } }
      @keyframes masar-glow {
        from { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.35); }
        to { box-shadow: 0 0 44px 6px rgba(0, 122, 255, 0.45); }
      }
      @media (prefers-color-scheme: dark) {
        /* يطابق bg الداكن في tokens.ts (#000000) حتى لا يظهر شرخ لوني عند تسليم
           الشاشة للتطبيق — وسكربت masar-theme-boot أعلاه يغطي الاختيار اليدوي. */
        #boot-splash { background: #000000; }
        #boot-splash .title { color: #F1F5F9; }
        #boot-splash .spinner { border-color: #1E293B; border-top-color: #0A84FF; }
      }
    </style>
  </head>
  <body>
    <noscript>يحتاج التطبيق إلى تفعيل جافاسكربت ليعمل. / This app requires JavaScript.</noscript>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-label="جارٍ التحميل">
      <div class="logo">م</div>
      <div class="title">مسار</div>
      <div class="caption">منظومة تنظيم مراكز التدريب</div>
      <div class="spinner"></div>
    </div>
    <script>
      // إخفاء شاشة الإقلاع فور رسم التطبيق (BootSplash الداخلية تكمل المشهد)
      (function () {
        var hide = function () {
          var el = document.getElementById('boot-splash');
          if (el && !el._hidden) {
            el._hidden = true;
            el.style.transition = 'opacity .3s';
            el.style.opacity = '0';
            setTimeout(function () {
              if (el.parentNode) el.parentNode.removeChild(el);
              else if (typeof el.remove === 'function') el.remove();
            }, 320);
          }
        };
        var mo = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) {
            hide();
            mo.disconnect();
          }
        });
        var rootEl = document.getElementById('root');
        if (rootEl) mo.observe(rootEl, { childList: true });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            var caption = document.querySelector('#boot-splash .caption');
            if (caption) caption.textContent = 'استغرق التحميل وقتاً طويلاً. يرجى تحديث الصفحة أو التحقق من الاتصال.';
          }
          hide();
        }, 20000); // أمان: لو فشل التحميل لا نحبس المستخدم

        // A11Y-12 (WCAG 2.4.11): حارس تمرير عند التركيز لمنع حجب العنصر خلف الشريط السفلي العائم
        document.addEventListener('focusin', function (e) {
          var target = e.target;
          if (!target || typeof target.getBoundingClientRect !== 'function') return;
          if (target.closest && target.closest('[role="navigation"]')) return;
          var rect = target.getBoundingClientRect();
          var rawPad = getComputedStyle(document.documentElement).getPropertyValue('--masar-tabbar-h');
          var pad = parseInt(rawPad, 10) || 140;
          if (rect.bottom > window.innerHeight - pad && typeof target.scrollIntoView === 'function') {
            target.scrollIntoView({ block: 'center', inline: 'nearest' });
          }
        }, true);

        // WEB-02: تسجيل Service Worker لحفظ القشرة الثابتة والأصول في وضع عدم الاتصال
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          });
        }
      })();
    </script>
  </body>
</html>
