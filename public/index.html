<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- react-native-web style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <style id="expo-boot-splash">
      /* شاشة إقلاع فورية قبل تحميل الحزمة — تستبدلها BootSplash داخل التطبيق */
      #boot-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #F7F8FC;
        font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
      }
      #boot-splash .logo {
        width: 96px; height: 96px; border-radius: 28px;
        background: linear-gradient(135deg, #4F46E5, #7C3AED);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 44px; font-weight: 700;
        animation: masar-glow 1.2s ease-in-out infinite alternate;
      }
      #boot-splash .title { margin-top: 18px; font-size: 28px; font-weight: 700; color: #0F172A; }
      #boot-splash .caption { margin-top: 6px; font-size: 14px; color: #64748B; }
      #boot-splash .spinner {
        margin-top: 28px; width: 30px; height: 30px; border-radius: 50%;
        border: 3px solid #E0E7FF; border-top-color: #4F46E5;
        animation: masar-spin 0.8s linear infinite;
      }
      @keyframes masar-spin { to { transform: rotate(360deg); } }
      @keyframes masar-glow {
        from { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.35); }
        to { box-shadow: 0 0 44px 6px rgba(79, 70, 229, 0.45); }
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash { background: #0B1220; }
        #boot-splash .title { color: #F1F5F9; }
        #boot-splash .spinner { border-color: #1E293B; border-top-color: #818CF8; }
      }
    </style>
  </head>
  <body>
    <noscript>يحتاج التطبيق إلى تفعيل جافاسكربت ليعمل. / This app requires JavaScript.</noscript>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-label="جارٍ التحميل">
      <div class="logo">م</div>
      <div class="title">مسار</div>
      <div class="caption">منظومة تنظيم مراكز التدريب</div>
      <div class="spinner"></div>
    </div>
    <script>
      // إخفاء شاشة الإقلاع فور رسم التطبيق (BootSplash الداخلية تكمل المشهد)
      (function () {
        var hide = function () {
          var el = document.getElementById('boot-splash');
          if (el && !el._hidden) { el._hidden = true; el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 320); }
        };
        var mo = new MutationObserver(function () { if (document.getElementById('root').childElementCount > 0) { hide(); mo.disconnect(); } });
        mo.observe(document.getElementById('root'), { childList: true });
        setTimeout(hide, 20000); // أمان: لو فشل التحميل لا نحبس المستخدم
      })();
    </script>
  </body>
</html>
