name: Production validation

on:
  pull_request:
  push:
    branches: [main, 'arena/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run parity
      - run: npm run test:engine
      - run: npm run export:web

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Initialize local Supabase configuration
        run: supabase init
      - name: Start local Supabase
        run: supabase start
      - name: Apply canonical migrations from an empty database
        run: supabase db reset
      - name: Show migration status
        run: supabase migration list --local
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
