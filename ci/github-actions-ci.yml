name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · i18n parity · engine · rls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript strict (zero errors)
        run: npm run typecheck

      - name: i18n key parity (ar ↔ en)
        run: npm run parity

      - name: RPC contract (client calls must exist server-side)
        run: npm run rpc:check

      - name: RPC types in sync with migrations
        run: npm run rpc:types

      - name: Engine behavioral tests
        run: npm run test:engine

      - name: RLS / race-condition tests
        run: npm run test:rls

      - name: SQL migration sanity (no IN-with-NULL CHECK pitfall)
        run: |
          # `x IN ('a', NULL)` in a CHECK constraint evaluates to NULL and never
          # rejects anything — the exact bug fixed in 0014. Block regressions.
          if grep -rEn "CHECK \(.*IN \([^)]*NULL[^)]*\)\)" supabase/migrations/ --include="*.sql" \
            | grep -v "IS NULL OR"; then
            echo "::error::Found CHECK constraint using IN(..., NULL) — this never rejects invalid values. Use: CHECK (col IS NULL OR col IN (...))"
            exit 1
          fi
          echo "OK — no broken CHECK constraints"

      - name: SQL migration sanity (balanced transactions & dollar-quotes)
        run: |
          fail=0
          for f in supabase/migrations/*.sql; do
            b=$(grep -c '^BEGIN;' "$f" || true)
            c=$(grep -c '^COMMIT;' "$f" || true)
            d=$(grep -o '\$\$' "$f" | wc -l)
            if [ "$b" != "$c" ]; then
              echo "::error file=$f::BEGIN/COMMIT mismatch (BEGIN=$b COMMIT=$c)"; fail=1
            fi
            if [ $((d % 2)) -ne 0 ]; then
              echo "::error file=$f::unbalanced \$\$ dollar-quote delimiters ($d)"; fail=1
            fi
          done
          [ "$fail" = "0" ] && echo "OK — migrations balanced"
          exit $fail

      - name: Security — SECURITY DEFINER must pin search_path
        run: |
          # A SECURITY DEFINER function without a fixed search_path is a
          # privilege-escalation vector (schema hijacking). Only real code lines
          # count -- SQL comments mentioning the phrase are not declarations.
          if grep -rn "SECURITY DEFINER" supabase/migrations/ --include="*.sql" \
            | grep -v "SET search_path" \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*--"; then
            echo "::error::SECURITY DEFINER function without 'SET search_path = public, pg_temp'"
            exit 1
          fi
          echo "OK — every SECURITY DEFINER pins search_path"

      - name: Dependency audit (high & critical only)
        run: npm audit --omit=dev --audit-level=high

      - name: Web export (bundle must build)
        run: npm run export:web

  database:
    name: supabase · db reset (best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase & apply migrations
        run: supabase start
      - name: Reset DB from empty & apply all migrations
        run: supabase db reset
