# MASAR 3.2 — Supabase local dev / CI configuration.
# Enables `supabase db reset` in the certification harness (P0 #9).
# Mimic the production project settings so CI tests reflect the schema faithfully.

project_id = "masar"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true

[inbucket]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://localhost:3000/auth/v1/callback"

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
